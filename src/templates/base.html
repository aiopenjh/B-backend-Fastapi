{# [담당 5] 모든 화면의 기본 틀: 각 화면은 extends로 물려받고 content 블록만 채움 #}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}예약 서비스{% endblock %} · TABLE</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body class="{% if active_page == 'login' %}is-login{% endif %}">
  <a class="skip-link" href="#content">본문으로 이동</a>
  {% include "components/sidebar.html" %}
  <div class="workspace">
    {% include "components/header.html" %}
    <main id="content" class="page-wrap">
      {% block content %}{% endblock %}
    </main>
    {% include "components/footer.html" %}
  </div>
</body>
</html>
